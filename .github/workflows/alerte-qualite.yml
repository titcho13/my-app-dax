name: alerte-qualite

on:
  schedule:
    - cron: "2,17,32,47 6-16 * * 1-5"   # 2 min après chaque clôture de bougie, lun-ven (UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer l'envoi d'un message (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alerte-qualite
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas numpy requests
      - run: python alerte_qualite.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force }}
      - name: Sauvegarder le dernier signal envoyé
        run: |
          if [ -n "$(git status --porcelain last_signal.txt)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add last_signal.txt
            git commit -m "maj dernier signal"
            git pull --rebase
            git push
          fi
