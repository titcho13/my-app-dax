name: DAX live

on:
  workflow_dispatch:
  schedule:
    # Heures en UTC. HIVER (CET = UTC+1) : valeurs ci-dessous.
    # ÉTÉ (CEST = UTC+2) : retire 1 h à chaque cron (7→6, 8→7, 11→10).
    - cron: "55 7 * * 1-5"    # matin : ~08:55 Paris
    - cron: "15 8 * * 1-5"    # secours si le cron du matin saute : ~09:15 Paris
    - cron: "30 11 * * 1-5"   # après-midi : ~12:30 Paris (attend la fin du matin)

permissions:
  contents: write

concurrency:
  group: dax-live              # jamais deux jobs en même temps
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dépendances
        run: pip install -r requirements.txt

      - name: Vérifier dax_core
        run: |
          test -f dax_core.py
          python -c "import sys; sys.path.insert(0,'.'); import dax_core; print('dax_core OK')"

      - name: Boucle live
        timeout-minutes: 320   # un run du matin tient jusqu'à ~14:15 Paris
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python dax_live.py

      - name: Sauver état
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f etat/etat_live.json ]; then
            git add etat/etat_live.json
            if ! git diff --cached --quiet; then
              git commit -m "maj état live [skip ci]"
              git pull --rebase origin main
              git push
            fi
          fi
