# Workflow GitHub Actions — DAX live, du lundi au vendredi 09:00 → 17:30 (heure de Paris).
#
# ⚠ GitHub cron est en UTC. Pour couvrir 09:00-17:30 Paris en été comme en hiver
#   (UTC+1 / UTC+2), deux jobs se relaient ; le script s'arrête de lui-même
#   après 17:30 Paris ou démarre en veille avant 09:00 (les minutes hors
#   séance sont ignorées par le script, qui n'envoie aucune alerte hors fenêtre).
#
# ⚠ Un job GitHub Actions dure 6 h maximum : d'où le relais matin / après-midi.
#
# 💰 Minutes consommées : ~9 h/jour ouvré. Sur un dépôt PUBLIC c'est illimité et
#   gratuit ; sur un dépôt privé vous dépasserez le quota gratuit (2 000 min/mois).
#
# À créer dans le dépôt : Settings → Secrets and variables → Actions →
#   TELEGRAM_TOKEN, TELEGRAM_CHAT_ID
# Et : Settings → Actions → General → Workflow permissions → "Read and write"

name: DAX live

on:
  schedule:
    - cron: "55 6 * * 1-5"    # job matin : 06:55 UTC (07:55/08:55 Paris), 6 h max
    - cron: "55 12 * * 1-5"   # job après-midi : relais jusqu'à la clôture 17:30 Paris
  workflow_dispatch: {}        # permet aussi un lancement manuel

concurrency:
  group: dax-live-${{ github.event.schedule }}
  cancel-in-progress: false

permissions:
  contents: write              # pour committer etat/etat_live.json (continuité entre jobs)

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

           - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -q yfinance statsmodels scipy requests numba matplotlib

      - name: Boucle live (alertes Telegram)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Paris
        run: python dax_live.py

      - name: Sauver l'état (continuité matin → après-midi)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etat/etat_live.json || true
          git commit -m "etat live $(date -u +%Y-%m-%dT%H:%M)" || echo "rien à committer"
          git push || echo "push impossible (rien de nouveau)"
