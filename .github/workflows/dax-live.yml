name: DAX live

on:
  workflow_dispatch:
  schedule:
    # Heures en UTC. HIVER (CET = UTC+1) : valeurs ci-dessous.
    # ÉTÉ (CEST = UTC+2) : remplace 55 7 → 55 6 et 55 11 → 55 10.
    - cron: "55 7 * * 1-5"    # matin : démarre vers 08:55 Paris
    - cron: "55 11 * * 1-5"   # après-midi : démarre vers 12:55 Paris

permissions:
  contents: write              # nécessaire pour commiter etat/etat_live.json

concurrency:
  group: dax-live              # jamais deux jobs en même temps
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dépendances
        run: pip install -r requirements.txt

      - name: Vérifier dax_core
        run: |
          test -f dax_core.py
          python -c "import sys; sys.path.insert(0,'.'); import dax_core; print('dax_core OK')"

      - name: Boucle live
        # Le job du matin est coupé après 4 h (≈ 12:55 Paris) ; celui de
        # l'après-midi s'arrête seul à 17:30 grâce au script.
        timeout-minutes: 240
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python dax_live.py

      - name: Sauver état
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f etat/etat_live.json ]; then
            git add etat/etat_live.json
            if ! git diff --cached --quiet; then
              git commit -m "maj état live [skip ci]"
              git pull --rebase origin main
              git push
            fi
          fi
