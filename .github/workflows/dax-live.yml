name: DAX live

on:
  workflow_dispatch:
  schedule:
    # Heures en UTC. HIVER (CET = UTC+1). ÉTÉ : retire 1 h à chaque cron.
    - cron: "55 7 * * 1-5"    # ~08:55 Paris
    - cron: "15 8 * * 1-5"    # secours ~09:15 Paris

permissions:
  contents: write
  actions: write               # nécessaire pour relancer le workflow

concurrency:
  group: dax-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dépendances
        run: pip install -r requirements.txt

      - name: Vérifier dax_core
        run: |
          test -f dax_core.py
          python -c "import sys; sys.path.insert(0,'.'); import dax_core; print('dax_core OK')"

      - name: Boucle live
        timeout-minutes: 320
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python dax_live.py

      - name: Sauver état
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f etat/etat_live.json ]; then
            git add etat/etat_live.json
            if ! git diff --cached --quiet; then
              git commit -m "maj état live [skip ci]"
              git pull --rebase origin main
              git push
            fi
          fi

      - name: Relancer pour la suite de la séance
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Europe/Paris date +%H%M)
          D=$(TZ=Europe/Paris date +%u)
          if [ "$D" -le 5 ] && [ "$H" -lt 1700 ]; then
            gh workflow run dax-live.yml --ref main
          fi
