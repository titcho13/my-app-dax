name: DAX live

on:
  schedule:
    - cron: "55 6 * * 1-5"
    - cron: "55 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: dax-live-${{ github.event.schedule }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Vérification dépôt
        run: |
          pwd
          ls -la
          find . -name "*.py"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install yfinance statsmodels scipy requests numba matplotlib pandas numpy

      - name: Vérifier dax_core
        run: |
          python -c "import os; print(os.listdir('.'))"
          python -c "import os; print('dax_core.py existe =', os.path.exists('dax_core.py'))"

      - name: Boucle live
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Paris
        run: |
          python dax_live.py

      - name: Sauver état
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etat/etat_live.json || true
          git commit -m "etat live" || true
          git push || true]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etat/etat_live.json || true
          git commit -m "etat live $(date -u +%Y-%m-%dT%H:%M)" || echo "rien à committer"
          git push || echo "push impossible (rien de nouveau)"
